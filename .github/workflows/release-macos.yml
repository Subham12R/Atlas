name: Publish macOS ARM64 release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  macos-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      # setup-python's macOS builds lack loadable SQLite extensions, which the memory
      # store (sqlite-vec) needs at runtime. PyInstaller bundles this same Python into
      # the app, so a build without it would ship with broken memory. Use Homebrew's.
      - name: Set up Python with loadable SQLite extensions
        run: |
          brew install python@3.12
          "$(brew --prefix python@3.12)/bin/python3.12" -m venv "$RUNNER_TEMP/python"
          echo "$RUNNER_TEMP/python/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/python/bin/python" -c "import sqlite3; sqlite3.connect(':memory:').enable_load_extension(True); print('sqlite extensions: ok')"

      - name: Check release tag matches app version
        run: |
          version="$(node -p 'require("./apps/desktop/package.json").version')"
          test "${GITHUB_REF_NAME#v}" = "$version" || {
            echo "Tag $GITHUB_REF_NAME does not match app version $version" >&2
            exit 1
          }

      - name: Assert Apple Silicon runner
        run: test "$(uname -m)" = arm64

      - name: Install server build dependencies
        run: python -m pip install --disable-pip-version-check -r server/requirements.txt

      - name: Run offline backend tests
        working-directory: server
        run: python -m unittest discover -s tests -v

      - name: Run desktop tests and typecheck
        working-directory: apps/desktop
        run: |
          npm ci
          npm run typecheck
          npm test -- --run
          node --test test/*.test.mjs

      - name: Build ARM64 app and embedded server
        working-directory: apps/desktop
        run: npm run build:mac

      - name: Verify bundle and prepare checksum
        id: artifacts
        run: |
          app_path="$GITHUB_WORKSPACE/apps/desktop/dist/mac-arm64/Atlas.app"
          test -d "$app_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          server_path="$app_path/Contents/Resources/server/atlas-server"
          test -x "$server_path"
          file "$server_path" | grep -q arm64

          dmg_path="$GITHUB_WORKSPACE/apps/desktop/dist/Atlas-${GITHUB_REF_NAME#v}-macos-arm64.dmg"
          test -f "$dmg_path"
          hdiutil verify "$dmg_path"
          (cd "$(dirname "$dmg_path")" && shasum -a 256 "$(basename "$dmg_path")" > "$(basename "$dmg_path").sha256")
          (cd "$(dirname "$dmg_path")" && shasum -a 256 -c "$(basename "$dmg_path").sha256")
          echo "app_path=$app_path" >> "$GITHUB_OUTPUT"
          echo "dmg_path=$dmg_path" >> "$GITHUB_OUTPUT"

      - name: Smoke-test embedded server bundle
        working-directory: server
        env:
          ATLAS_SERVER_BUNDLE: ${{ steps.artifacts.outputs.app_path }}/Contents/Resources/server
        run: python -m unittest tests.test_desktop_bundle -v

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "${{ steps.artifacts.outputs.dmg_path }}" \
            "${{ steps.artifacts.outputs.dmg_path }}.sha256" \
            --title "Atlas $GITHUB_REF_NAME" \
            --notes-file apps/desktop/RELEASE.md \
            --verify-tag
